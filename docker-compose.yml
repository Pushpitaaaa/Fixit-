services:
  server:
    build:
      context: ./server
    ports:
      - '5000:5000'
    volumes:
      - ./server/uploads:/usr/src/app/uploads
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/fixit
      - JWT_SECRET=change_this_secret
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
    ports:
      - '3000:3000'
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
    depends_on:
      - server
      - mongo

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'

volumes:
  mongo_data:
